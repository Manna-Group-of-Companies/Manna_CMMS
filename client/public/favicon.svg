<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Manna CMMS">
  <!-- Brand tile: the brand-600 orange from src/index.css, which is the orange
       in the Manna Group mark. Solid fill so it reads on light and dark tab
       bars. (An XML comment may not contain a double hyphen, so the CSS custom
       property is named in words here - written literally it made this whole
       file fail to parse and every browser fell back to the .ico.) -->
  <rect width="64" height="64" rx="14" fill="#d14a0c"/>
  <!-- The CMMS mark (23 Oct 2026): a solid gear with a wrench cut through it -
       maintenance, where the old mark was the store's "boxes". Drawn on lucide's
       24px grid. The same mark is the Android splash (ic_brand_mark.xml) and
       the app's assets/brand/cmms_mark.png; change the three together. -->
  <g transform="translate(11.6 11.6) scale(1.7)" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ffffff" stroke="#ffffff" stroke-width="1.2"
      d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
    <path fill="none" stroke="#d14a0c" stroke-width="3.6"
      transform="translate(4.8 4.8) scale(.6)"
      d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
  </g>
</svg>
